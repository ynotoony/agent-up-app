[[permission]]
identifier = "allow-m0-commands"
description = "Allow only the M0 and M2 typed runtime commands."
commands.allow = [
  "scan_project",
  "preview_initialize",
  "initialize_project",
  "create_request",
  "load_project",
  "list_projects",
  "register_project",
  "rebind_project",
  "preview_remove_agentup",
  "remove_agentup"
]
