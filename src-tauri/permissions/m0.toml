[[permission]]
identifier = "allow-m0-commands"
description = "Allow only the M0, M2, M3 and M4 typed runtime commands."
commands.allow = [
  "scan_project",
  "preview_initialize",
  "initialize_project",
  "create_request",
  "load_project",
  "list_projects",
  "register_project",
  "rebind_project",
  "preview_remove_agentup",
  "remove_agentup",
  "post_discussion",
  "add_attachment",
  "load_request_thread",
  "put_scope",
  "diff_scope",
  "put_task",
  "set_task_state",
  "load_board",
  "start_run",
  "apply_fake_script",
  "finish_run",
  "commit_changes",
  "cancel_run",
  "load_run"
]
