    status: refreshed
    trigger: 外部调研、技术方案比较或 spike
    read_when: 评估 Tauri、Agent runtime 或外部方案时
    sync_on: 契约、行为
    depends_on: [development-process]
    generated_from: external Agent Up template (not vendored)；刷新触发证据：用户于 2026-09-14 要求保留 retro skill 调研
