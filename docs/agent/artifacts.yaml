    sync_on: 无（观点变化新建报告，不覆盖归档）
    depends_on: [research-readme, development-process]
    generated_from: 用户指定的 GitHub URL 与 2026-09-14 读取的 SKILL.md 原文
    platform: neutral
    update_policy: 归档后禁止覆盖；观点变化时新建报告并互相引用

  - id: spec-001-m0-foundation
    path: docs/specs/001-m0-foundation.md
    kind: spec
