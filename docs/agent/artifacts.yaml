# Input: 目标项目的产物清单、生成/删除/移动动作与访谈盘点确认的产物事实。
# Output: 目标项目治理产物的机器索引（docs/agent/artifacts.yaml）：十三字段登记与 seed 七件初始清单。
# Pos: 产物机器索引（seed 七件之一）；一旦我被更新，务必更新所属目录 README 登记。

# 字段（十三个；缺值写 N/A + reason，不留空）：
#   id              产物稳定标识
#   path            仓库内路径
#   kind            产物类型（governance / index / record / spec / request / task / map / adapter / script 等；新增值先在此注释区登记）
#   authority       在权威层级中的层级（层级定义见 docs/development-process.md §2.3）
#   owner           唯一写入者
#   lifecycle       Seed / Conditional / Record / Derived / Adapter
#   trigger         创建触发条件（对齐 docs/development-process.md §5.2 触发矩阵；Seed 写 always）
#   read_when       读取时机（对齐读取阶梯与任务类型）
#   sync_on         触发级联同步的变化类型（契约 / 拓扑 / 行为 / 派生；纯追加记录写 无）
#   depends_on      依赖的其他产物 id（YAML 列表）
#   generated_from  生成来源（模板或事实源；Derived 必填）
#   platform        平台绑定信息；平台无关写 neutral（当前已知集合：neutral / zcode；新增宿主值先在此注释区登记）
#   update_policy   更新策略（追加 / 状态机更新 / 可重建 / 禁止覆盖）
#
# 维护规则（权威见 docs/development-process.md §5）：
#   生成、删除或移动任何治理产物时同步登记或注销条目；登记与实际文件漂移时将相关产物标 stale 并报告，不静默修正任一侧。

artifacts:
  - id: agents-md
    path: AGENTS.md
    kind: governance
    authority: 权威层级第 4 级（流程规则：路由与边界）
    owner: 经用户确认的 Implementation 执行体
    lifecycle: Seed
    trigger: always
    read_when: 每个会话第一步
    sync_on: 契约、拓扑（路由指向、权威来源或边界变化）
    depends_on: [development-process, progress, artifacts-yaml]
    generated_from: external Agent Up template (not vendored)
    platform: neutral
    update_policy: 极短路由；语义变化经用户确认后修改
  - id: docs-readme
    path: docs/README.md
    kind: governance
    authority: 权威层级第 6 级（导航索引：从目录成员事实更新）
    owner: Implementation 执行体（目录成员变化时）
    lifecycle: Seed
    trigger: always
    read_when: 导航 docs 目录成员时
    sync_on: 拓扑（docs 下文件增删或目录职责变化）
    depends_on: [development-process, artifacts-yaml]
    generated_from: external Agent Up template (not vendored)
    platform: neutral
    update_policy: 按目录事实更新成员登记
  - id: development-process
    path: docs/development-process.md
    kind: governance
    authority: 权威层级第 4 级（流程规则：唯一流程权威）
    owner: 协调记录 owner（变更经用户确认）
    lifecycle: Seed
    trigger: always
    read_when: 执行任何任务流程、判定读取范围或处理权威冲突时
    sync_on: 契约、行为（流程、门禁、权限、验证要求变化）
    depends_on: [artifacts-yaml]
    generated_from: external Agent Up template (not vendored)
    platform: neutral
    update_policy: 语义变化经用户确认后修改；正文为规范本体
  - id: progress
    path: docs/progress.md
    kind: record
    authority: 权威层级第 2 级（事实记录：进度状态）
    owner: 各阶段执行体（只写本阶段状态行与 Checkpoint）
    lifecycle: Record
    trigger: always
    read_when: 接手或恢复会话时
    sync_on: 无（状态行按状态机更新，纯追加不触发级联）
    depends_on: [development-process]
    generated_from: external Agent Up template (not vendored)
    platform: neutral
    update_policy: 状态机更新；每票不超过 5 行；禁止覆盖既有条目
  - id: changes
    path: docs/changes.md
    kind: record
    authority: 权威层级第 2 级（事实记录：变更历史）
    owner: 协调记录 owner 与各阶段执行体（按追加条目）
    lifecycle: Record
    trigger: always
    read_when: 需要变更背景、审计或追溯决策时
    sync_on: 无（新条目纯追加，不触发级联）
    depends_on: [development-process]
    generated_from: external Agent Up template (not vendored)
    platform: neutral
    update_policy: 追加；只增不改，不改写历史条目
  - id: requests-readme
    path: docs/requests/README.md
    kind: governance
    authority: 权威层级第 4 级（流程规则：REQ 队列规则）
    owner: 协调记录 owner（变更经用户确认）
    lifecycle: Seed
    trigger: always
    read_when: 接收、推进或追溯需求请求时
    sync_on: 契约、行为（队列规则或状态机语义变化）
    depends_on: [development-process, progress]
    generated_from: external Agent Up template (not vendored)
    platform: neutral
    update_policy: 队列规则变化经用户确认后修改
  - id: artifacts-yaml
    path: docs/agent/artifacts.yaml
    kind: index
    authority: 权威层级第 2 级（事实记录：产物登记）
    owner: Implementation 执行体或协调记录 owner（按产物归属）
    lifecycle: Seed
    trigger: always
    read_when: 涉及产物关系、增删移动或漂移自查时
    sync_on: 拓扑、派生（产物增删移动、生成来源或依赖关系变化）
    depends_on: [development-process]
    generated_from: external Agent Up template (not vendored)
    platform: neutral
    update_policy: 状态机更新；产物登记同步；漂移标 stale 并报告

  - id: development-plan
    path: docs/development-plan.md
    kind: plan
    authority: 权威层级第 3 级（规格与计划）
    owner: 用户确认后的协调记录 owner
    lifecycle: Record
    trigger: 用户要求制定或修改开发计划
    read_when: 规划、拆票或评估开发范围时
    sync_on: 契约、拓扑、行为
    depends_on: [development-process]
    generated_from: 用户规格与确认决策
    platform: neutral
    update_policy: 用户确认后更新；变更追加 docs/changes.md
  - id: context
    path: docs/CONTEXT.md
    kind: context
    authority: 权威层级第 3 级（领域语义）
    owner: 用户确认后的协调记录 owner
    lifecycle: Conditional
    trigger: 已确认项目特有术语、角色或状态
    read_when: 解释领域对象、状态或流程时
    sync_on: 契约、行为
    depends_on: [development-process]
    generated_from: 用户规格与确认决策
    platform: neutral
    update_policy: 语义变化经用户确认后更新
  - id: issues-readme
    path: docs/issues/README.md
    kind: governance
    authority: 权威层级第 4 级（任务票规则）
    owner: 协调记录 owner
    lifecycle: Conditional
    trigger: 需要两张及以上任务票或存在依赖
    read_when: 拆票、领取或交接任务时
    sync_on: 拓扑、行为
    depends_on: [development-process, progress]
    generated_from: external Agent Up template (not vendored)
    platform: neutral
    update_policy: 任务队列规则经用户确认后更新
  - id: specs-readme
    path: docs/specs/README.md
    kind: governance
    authority: 权威层级第 4 级（规格索引）
    owner: 协调记录 owner
    lifecycle: Conditional
    trigger: 公共行为、接口或多条验收路径
    read_when: 修改产品行为或公共接口时
    sync_on: 契约、行为
    depends_on: [development-process]
    generated_from: external Agent Up template (not vendored)
    platform: neutral
    update_policy: 规格规则经用户确认后更新
  - id: research-readme
    path: docs/research/README.md
    kind: governance
    authority: 权威层级第 4 级（调研索引）
    owner: 协调记录 owner
    lifecycle: Conditional
    trigger: 外部调研、技术方案比较或 spike
    read_when: 评估 Tauri、Agent runtime 或外部方案时
    sync_on: 契约、行为
    depends_on: [development-process]
    generated_from: external Agent Up template (not vendored)
    platform: neutral
    update_policy: 调研索引按新增报告更新

  - id: agent-readme
    path: docs/agent/README.md
    kind: index
    authority: 权威层级第 6 级（导航索引）
    owner: Implementation 执行体（目录成员变化时）
    lifecycle: Seed
    trigger: always
    read_when: 导航 Agent 治理产物时
    sync_on: 拓扑
    depends_on: [artifacts-yaml]
    generated_from: 人工登记
    platform: neutral
    update_policy: 按目录成员更新
  - id: agent-roles-readme
    path: docs/agent/roles/README.md
    kind: index
    authority: 权威层级第 6 级（导航索引）
    owner: Implementation 执行体（目录成员变化时）
    lifecycle: Seed
    trigger: always
    read_when: 读取阶段角色合同时
    sync_on: 拓扑
    depends_on: [agent-readme]
    generated_from: 人工登记
    platform: neutral
    update_policy: 按目录成员更新

  # 条件产物登记样例（命中触发矩阵/Intake 才创建；按实际产物仿照登记，不预建）：
  # - id: req-YYYYMMDD-NN
  #   path: docs/requests/REQ-YYYYMMDD-NN.md
  #   kind: request
  #   authority: 权威层级第 2 级（事实记录：需求请求）
  #   owner: Intake 会话执行体（新建）；Triage 执行体（状态流转）
  #   lifecycle: Record
  #   trigger: Intake 接收新需求并落盘
  #   read_when: 处理对应需求、Triage 或追溯决策来源时
  #   sync_on: 无（状态流转按状态机更新，不级联）
  #   depends_on: [requests-readme]
  #   generated_from: 访谈或对话原文
  #   platform: neutral
  #   update_policy: 状态机更新；正文只追加不改写
  #
  # - id: project-map
  #   path: docs/agent/project-map.json
  #   kind: map
  #   authority: 权威层级第 6 级（派生文件）
  #   owner: Implementation 执行体
  #   lifecycle: Derived
  #   trigger: 跨模块导航需要；仓库规模大；用户要求；旧地图过期
  #   read_when: 跨模块导航或定位文件时
  #   sync_on: 拓扑（成员文件增删移动触发重建）
  #   depends_on: [artifacts-yaml]
  #   generated_from: 仓库文件清单（N/A + reason 不适用时逐字段说明）
  #   platform: neutral
  #   update_policy: 可重建；重建须标注来源/时间/覆盖范围/失效条件
