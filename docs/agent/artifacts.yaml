    sync_on: 契约、行为
    depends_on: [specs-readme, context, development-process]
    generated_from: 用户于 2026-09-14 明确要求开始 M0；现有治理规则、CONTEXT 和开发计划
    platform: neutral
    update_policy: "ApprovalState: approved 后作为当前规格；重大变化新建规格并 supersede 本文件"

